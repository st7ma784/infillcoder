[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrprintplugin"
version = "0.1.0"
description = "GCode Layer Fingerprinting via infill line spacing modulation"
requires-python = ">=3.9"
dependencies = [
    "reedsolo>=1.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
web = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0", "python-multipart>=0.0.9", "aiofiles>=23.0.0"]

[project.scripts]
infillcode-web = "web.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
