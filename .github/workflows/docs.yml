name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the core + web package so autodoc can import it.
      # We do NOT install octoprint — conf.py mocks it via autodoc_mock_imports.
      - name: Install package dependencies
        run: pip install -e ".[dev]"

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML docs
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      # Upload the built site as a GitHub Pages artifact (main branch only).
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
